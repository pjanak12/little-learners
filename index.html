<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Little Learners Garden</title>
<meta name="description" content="Gentle learning games for ages 6 to 8.">
<meta name="theme-color" content="#FFFFFF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Little Learners">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{-webkit-text-size-adjust:100%}
body{margin:0;overscroll-behavior:none;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
input,select{-webkit-user-select:text;user-select:text}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Baloo+Bhai+2:wght@500;700;800&family=Nunito:wght@500;700;800&display=swap">
<style>
/* Layout: one-screen app, sticky profile bar on top, big-tap "garden plot" tiles below. Single bright light look by design. */
:root{
  color-scheme: light;
  --sky:#E3F3FB; --sky-deep:#BFE3F4; --paper:#FFFFFF; --ink:#1E2B45; --ink-soft:#56627C; --line:#D3E6EF;
  --sun:#FFC83D; --sun-soft:#FFF1C7; --leaf:#2FB36E; --leaf-soft:#DDF5E7; --coral:#FF7A59; --coral-soft:#FFE4DC;
  --ocean:#2F86D6; --ocean-soft:#DCEBFA; --rose:#E85D8F; --rose-soft:#FCE1EB; --clay:#C9773A; --clay-soft:#F8E7D8;
  --good:#22A060; --warn:#E59A12; --bad:#E0573B;
  --f-display:"Baloo 2","Baloo Bhai 2",ui-rounded,"Arial Rounded MT Bold",system-ui,sans-serif;
  --f-body:"Nunito",ui-rounded,system-ui,-apple-system,sans-serif;
  --f-gu:"Baloo Bhai 2","Noto Sans Gujarati",sans-serif;
  --r-lg:28px; --r-md:20px; --r-sm:14px;
  --shadow:0 4px 0 rgba(30,43,69,.10);
}
*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--sky);color:var(--ink);font-family:var(--f-body);font-size:16px;-webkit-tap-highlight-color:transparent;
  background-image:radial-gradient(ellipse 180px 60px at 12% 6%,#fff 60%,transparent 62%),radial-gradient(ellipse 140px 46px at 88% 14%,#fff 60%,transparent 62%);
  background-attachment:fixed}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--paper)}
button,input,select{font:inherit;color:inherit}
button{cursor:pointer;touch-action:manipulation;border:0;background:none}
button:focus-visible,input:focus-visible,select:focus-visible{outline:4px solid var(--ocean);outline-offset:2px}
.gu{font-family:var(--f-gu)}
#app{max-width:900px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
.wrap{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:16px 32px;display:flex;flex-direction:column;gap:16px;flex:1}

/* Top bar */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);border-bottom:3px solid var(--line);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px;
  display:flex;align-items:center;gap:10px}
.profile{display:flex;align-items:center;gap:10px;min-width:0;flex:1}
.avatar{width:48px;height:48px;border-radius:50%;background:var(--sun-soft);border:3px solid var(--sun);display:grid;place-items:center;font-size:28px;flex:none}
.pname{font-family:var(--f-display);font-weight:800;font-size:1.35rem;line-height:1.05;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.psub{font-size:.8rem;color:var(--ink-soft);font-weight:700}
.timer{display:flex;align-items:center;gap:6px;background:var(--leaf-soft);color:#16653D;border-radius:999px;padding:6px 12px;font-weight:800;font-size:.9rem;white-space:nowrap;font-variant-numeric:tabular-nums}
.timer.low{background:var(--coral-soft);color:#9A3216}
.lockbtn{width:44px;height:44px;border-radius:50%;background:var(--sky);display:grid;place-items:center;font-size:20px;flex:none}

/* Home */
.hello{display:flex;align-items:center;gap:14px;background:var(--paper);border-radius:var(--r-lg);padding:16px 18px;box-shadow:var(--shadow)}
.hello .big{font-size:56px;line-height:1;animation:bob 3s ease-in-out infinite}
.hello h1{font-family:var(--f-display);font-size:1.6rem;margin:0;line-height:1.1;text-wrap:balance}
.hello p{margin:2px 0 0;color:var(--ink-soft);font-weight:700}
.tiles{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
@media (min-width:640px){.tiles{grid-template-columns:repeat(3,minmax(0,1fr))}}
.tile{background:var(--paper);border-radius:var(--r-lg);padding:16px 14px 14px;text-align:left;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:6px;border:3px solid transparent;min-height:150px;transition:transform .12s}
.tile:active{transform:scale(.97)}
.tile .ani{width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:40px}
.tile .tn{font-family:var(--f-display);font-weight:800;font-size:1.25rem;line-height:1.1}
.tile .ts{font-size:.85rem;color:var(--ink-soft);font-weight:700}
.tile .lv{margin-top:auto;font-size:.75rem;font-weight:800;color:var(--ink-soft);display:flex;gap:3px;align-items:center}
.dot{width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.on{background:var(--sun)}
.c-math .ani{background:var(--sun-soft)} .c-think .ani{background:var(--ocean-soft)} .c-puzzle .ani{background:var(--rose-soft)}
.c-words .ani{background:var(--leaf-soft)} .c-gujarati .ani{background:var(--clay-soft)} .c-hindi .ani{background:var(--coral-soft)} .c-memory .ani{background:var(--ocean-soft)}
.rowbtns{display:flex;gap:12px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:8px;background:var(--paper);border-radius:999px;padding:12px 18px;font-weight:800;box-shadow:var(--shadow);min-height:52px}
.note{font-size:.85rem;color:var(--ink-soft);text-align:center}

/* Game */
.gtop{display:flex;align-items:center;gap:12px}
.back{width:52px;height:52px;border-radius:50%;background:var(--paper);box-shadow:var(--shadow);font-size:24px;font-weight:800;flex:none}
.prog{display:flex;gap:6px;flex:1;justify-content:center}
.prog span{width:22px;height:10px;border-radius:6px;background:var(--paper)}
.prog span.done{background:var(--leaf)} .prog span.now{background:var(--sun)}
.starcount{font-family:var(--f-display);font-weight:800;font-size:1.3rem;background:var(--paper);border-radius:999px;padding:6px 14px;box-shadow:var(--shadow)}
.qcard{background:var(--paper);border-radius:var(--r-lg);padding:22px 18px;box-shadow:var(--shadow);text-align:center;position:relative;display:flex;flex-direction:column;gap:10px;align-items:center}
.qt{font-family:var(--f-display);font-weight:700;font-size:1.35rem;line-height:1.2;text-wrap:balance}
.qbig{font-family:var(--f-display);font-weight:800;font-size:2.6rem;line-height:1.15;letter-spacing:.02em}
.qhuge{font-size:5rem;line-height:1.05}
.erow{font-size:2.3rem;line-height:1.3;word-break:break-all;max-width:100%}
.mini{font-size:.95rem;color:var(--ink-soft);font-weight:700}
.blank{display:inline-block;min-width:1.1em;border-bottom:5px solid var(--sun);color:transparent}
.say{position:absolute;top:10px;right:10px;width:48px;height:48px;border-radius:50%;background:var(--sun-soft);font-size:22px}
.eqgrid{display:grid;gap:6px;font-family:var(--f-display);font-size:2rem;font-weight:800}
.lgrid{display:grid;grid-template-columns:repeat(3,64px);gap:6px;justify-content:center}
.lgrid div{height:64px;border-radius:14px;background:var(--sky);display:grid;place-items:center;font-size:2.2rem}
.lgrid .gap{background:var(--sun-soft);border:3px dashed var(--sun);font-family:var(--f-display);font-weight:800;color:var(--warn)}
.opts{display:grid;gap:12px;grid-template-columns:repeat(3,minmax(0,1fr))}
.opts.n4{grid-template-columns:repeat(2,minmax(0,1fr))}
@media (min-width:640px){.opts.n4{grid-template-columns:repeat(4,minmax(0,1fr))}}
.opt{background:var(--paper);border-radius:var(--r-md);min-height:96px;padding:10px 6px;box-shadow:0 5px 0 var(--line);font-family:var(--f-display);font-weight:800;font-size:2.1rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;border:3px solid var(--line);line-height:1.1;transition:transform .1s}
.opt:active{transform:translateY(3px);box-shadow:0 2px 0 var(--line)}
.opt small{font-family:var(--f-body);font-size:.78rem;color:var(--ink-soft);font-weight:800}
.opt .w{font-size:1.25rem}
.opt.right{background:var(--leaf-soft);border-color:var(--leaf);box-shadow:0 5px 0 var(--leaf)}
.opt.wrong{background:var(--coral-soft);border-color:var(--coral);opacity:.6;animation:shake .35s}
.opt.reveal{border-color:var(--leaf);border-style:dashed}
.opt:disabled{cursor:default}
.fb{min-height:76px;text-wrap:pretty;display:flex;align-items:center;justify-content:center;gap:12px;font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-align:center}
.fb .fa{font-size:52px;animation:pop .45s ease-out}
.fb.good{color:#16653D} .fb.try{color:#9A3216}
.fb .hintline{display:block;margin-top:6px;background:var(--sun-soft);color:var(--ink);border-radius:14px;padding:8px 12px;font-family:var(--f-body);font-size:1rem;font-weight:800}
.fb .sub{display:block;font-family:var(--f-body);font-size:.9rem;color:var(--ink-soft);font-weight:700}

/* Memory */
.mgrid{display:grid;gap:10px;justify-content:center}
.mcard{aspect-ratio:1;max-width:100%;border-radius:18px;background:var(--ocean);box-shadow:0 5px 0 #1E5E9C;font-size:2.4rem;display:grid;place-items:center;color:#fff;transition:transform .2s}
.mcard.open,.mcard.done{background:var(--paper);box-shadow:0 5px 0 var(--line);transform:rotateY(0)}
.mcard.done{background:var(--leaf-soft);box-shadow:0 5px 0 var(--leaf)}

/* Result / lock */
.center{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;text-align:center;padding-block:24px}
.hero-ani{font-size:110px;line-height:1;animation:pop .6s ease-out}
.center h2{font-family:var(--f-display);font-size:2rem;margin:0;line-height:1.1;text-wrap:balance}
.center p{margin:0;color:var(--ink-soft);font-weight:700;max-width:34ch;font-size:1.05rem}
.bigstars{font-size:2.6rem;letter-spacing:.08em}
.bigstars .off{filter:grayscale(1);opacity:.25}
.btn{background:var(--leaf);color:#fff;border-radius:999px;padding:14px 26px;font-family:var(--f-display);font-weight:800;font-size:1.25rem;box-shadow:0 5px 0 #1C7F4C;min-height:56px}
.btn.alt{background:var(--paper);color:var(--ink);box-shadow:0 5px 0 var(--line)}
.btn.sun{background:var(--sun);color:var(--ink);box-shadow:0 5px 0 #CF9A12}
.btn:disabled{opacity:.45}
.btn.sm{font-size:1rem;padding:10px 18px;min-height:46px}
.linkbtn{color:var(--ocean);font-weight:800;text-decoration:underline;padding:8px}
.ring{width:120px;height:120px}

/* PIN */
.overlay{position:fixed;inset:0;background:rgba(30,43,69,.55);z-index:50;display:grid;place-items:center;padding:16px}
.pinbox{background:var(--paper);border-radius:var(--r-lg);padding:22px;width:min(340px,100%);display:flex;flex-direction:column;gap:14px;align-items:center;text-align:center}
.pinbox h3{margin:0;font-family:var(--f-display);font-size:1.4rem}
.pindots{display:flex;gap:14px}
.pindots span{width:18px;height:18px;border-radius:50%;border:3px solid var(--ink-soft)}
.pindots span.f{background:var(--ink);border-color:var(--ink)}
.keypad{display:grid;grid-template-columns:repeat(3,72px);gap:10px}
.keypad button{height:62px;border-radius:16px;background:var(--sky);font-family:var(--f-display);font-weight:800;font-size:1.6rem}
.err{color:var(--bad);font-weight:800;min-height:1.3em;font-size:.95rem}

/* Parent area */
.ptop{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ptop h1{font-family:var(--f-display);font-size:1.6rem;margin:0;flex:1 1 100%;min-width:0}
.tabs{display:flex;gap:6px;background:var(--paper);padding:5px;border-radius:999px;box-shadow:var(--shadow)}
.tabs button{padding:10px 18px;border-radius:999px;font-weight:800;min-height:44px}
.tabs button.on{background:var(--ink);color:#fff}
.panel{background:var(--paper);border-radius:var(--r-md);padding:18px;box-shadow:var(--shadow);display:flex;flex-direction:column;gap:12px;min-width:0}
.panel h2{margin:0;font-family:var(--f-display);font-size:1.25rem}
.panel h3{margin:0;font-size:1rem}
.mhead{display:flex;align-items:center;gap:10px;justify-content:space-between}
.mhead .mn{font-family:var(--f-display);font-weight:800;font-size:1.3rem;text-align:center}
.kpis{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
@media (min-width:640px){.kpis{grid-template-columns:repeat(5,minmax(0,1fr))}}
.kpi{background:var(--sky);border-radius:var(--r-sm);padding:12px}
.kpi .v{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1;font-variant-numeric:tabular-nums}
.kpi .l{font-size:.75rem;font-weight:800;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.05em;margin-top:4px}
.kpi .d{font-size:.8rem;font-weight:800;margin-top:4px}
.up{color:var(--good)} .down{color:var(--bad)} .flat{color:var(--ink-soft)}
.chart{overflow-x:auto}
.chart svg{display:block;width:100%;min-width:520px;height:auto}
.skrow{display:grid;grid-template-columns:150px minmax(0,1fr) 56px;gap:10px;align-items:center;font-weight:700;font-size:.9rem}
.skrow .bar{height:16px;background:var(--sky);border-radius:8px;overflow:hidden}
.skrow .bar i{display:block;height:100%;border-radius:8px}
.skrow .pc{text-align:right;font-variant-numeric:tabular-nums;font-weight:800}
.skrow .nm small{display:block;color:var(--ink-soft);font-size:.75rem}
@media (max-width:460px){.skrow{grid-template-columns:110px minmax(0,1fr) 46px}}
.insight{display:flex;gap:10px;align-items:flex-start;background:var(--sky);border-radius:var(--r-sm);padding:12px;font-weight:700}
.insight b{font-family:var(--f-display)}
.tag{display:inline-block;background:var(--sun-soft);color:#7A5600;border-radius:999px;padding:3px 10px;font-size:.75rem;font-weight:800}
.form{display:grid;gap:14px}
.field{display:flex;flex-direction:column;gap:6px}
.field label,.flabel{font-weight:800;font-size:.9rem}
.field input,.field select{border:2px solid var(--line);border-radius:12px;padding:12px;background:var(--paper);min-height:48px;font-size:1rem}
.seg{display:flex;gap:8px;flex-wrap:wrap}
.seg button{border:2px solid var(--line);border-radius:12px;padding:10px 16px;font-weight:800;min-height:48px;background:var(--paper)}
.seg button.on{background:var(--ink);border-color:var(--ink);color:#fff}
.buddies{display:flex;gap:8px;flex-wrap:wrap}
.buddies button{width:56px;height:56px;border-radius:16px;font-size:32px;border:3px solid var(--line);background:var(--paper)}
.buddies button.on{border-color:var(--sun);background:var(--sun-soft)}
.toggle{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px solid var(--line);font-weight:700}
.toggle:last-child{border-bottom:0}
.sw{width:56px;height:32px;border-radius:999px;background:var(--line);position:relative;flex:none}
.sw::after{content:"";position:absolute;top:4px;left:4px;width:24px;height:24px;border-radius:50%;background:#fff;transition:left .15s}
.sw.on{background:var(--leaf)} .sw.on::after{left:28px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr));gap:16px}
.principles{margin:0;padding-left:20px;display:grid;gap:6px;color:var(--ink-soft);font-weight:600;font-size:.92rem}
.danger{background:var(--coral-soft);border-radius:var(--r-sm);padding:12px;display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-weight:700}
.setup{max-width:560px;margin:0 auto;width:100%}
.setup .logo{font-size:64px;text-align:center}
.setup h1{font-family:var(--f-display);text-align:center;margin:0;font-size:2rem;line-height:1.1}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:#fff;padding:12px 20px;border-radius:999px;font-weight:800;z-index:60}

.pad{position:relative;width:100%;max-width:380px;aspect-ratio:1;margin:0 auto;background:var(--paper);border-radius:var(--r-lg);box-shadow:var(--shadow);border:3px solid var(--line);overflow:hidden;touch-action:none}
.pad canvas{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.tools{display:flex;gap:10px;justify-content:center;align-items:center;flex-wrap:wrap}
.crayons{display:flex;gap:8px;flex-wrap:wrap;justify-content:center;width:100%}
.crayon{width:44px;height:44px;border-radius:50%;border:4px solid var(--paper);box-shadow:0 0 0 2px var(--line)}
.crayon.on{box-shadow:0 0 0 4px var(--ink);transform:scale(1.08)}
.tresult{display:flex;gap:14px;align-items:flex-start;background:var(--paper);border-radius:var(--r-lg);padding:16px;box-shadow:var(--shadow)}
.tresult .medal{font-size:72px;line-height:1;animation:pop .6s ease-out}
.mtitle{font-family:var(--f-display);font-weight:800;font-size:1.5rem;line-height:1.1}
.meter{position:relative;height:16px;background:var(--sky);border-radius:8px;margin:18px 0 8px}
.meter i{display:block;height:100%;border-radius:8px;background:linear-gradient(90deg,var(--coral),var(--sun),var(--leaf))}
.meter span{position:absolute;top:-20px;transform:translateX(-50%);font-size:16px}
.meter span::after{content:"";position:absolute;left:50%;top:20px;width:2px;height:16px;background:var(--ink-soft);opacity:.35}
.praise{font-weight:800;margin-top:6px}
.tip{margin-top:8px;background:var(--sun-soft);border-radius:14px;padding:8px 12px;font-weight:800}
.modes{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.modes button{border:3px solid var(--line);border-radius:var(--r-md);padding:12px;display:flex;flex-direction:column;align-items:center;gap:2px;font-family:var(--f-display);font-weight:800;font-size:1.2rem;background:var(--paper)}
.modes button span{font-size:2rem}.modes button small{font-family:var(--f-body);font-size:.8rem;color:var(--ink-soft)}
.modes button.on{border-color:var(--sun);background:var(--sun-soft)}
.tcats{display:grid;grid-template-columns:repeat(auto-fill,minmax(140px,1fr));gap:10px}
.tcat{border:3px solid var(--line);border-radius:var(--r-md);padding:14px 10px;display:flex;flex-direction:column;align-items:center;gap:4px;background:var(--paper);min-height:96px}
.tcat:active{transform:scale(.97)}
.tcs{font-family:var(--f-display);font-weight:800;font-size:1.8rem;line-height:1.1}
.tcs.gu,.mch.gu{font-family:var(--f-gu)}
.tcl{font-weight:800;font-size:.85rem;color:var(--ink-soft)}
.medalrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap}
.mcell{background:var(--paper);border-radius:var(--r-md);padding:10px 16px;display:flex;flex-direction:column;align-items:center;box-shadow:var(--shadow);min-width:84px}
.mch{font-family:var(--f-display);font-weight:800;font-size:2.2rem;line-height:1.1}
.principles b{color:var(--ink)}
@keyframes bob{50%{transform:translateY(-6px)}}
@keyframes pop{0%{transform:scale(.3);opacity:0}70%{transform:scale(1.12)}100%{transform:scale(1);opacity:1}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>

<div id="app"></div>

<script>
(()=>{
const KEY='littleLearners.v1';
const SKILLS=[
 {id:'math',name:'Maths',sub:'Number Jungle',ani:'🦁',color:'#F2B21C'},
 {id:'think',name:'Thinking',sub:'Owl’s brain games',ani:'🦉',color:'#2F86D6'},
 {id:'puzzle',name:'Puzzles',sub:'Octopus puzzles',ani:'🐙',color:'#E85D8F'},

function unitOf(tp){for(let L=1;L<=tp.length;L++){let ok=true;for(let i=L;i<tp.length;i++)if(tp[i]!==tp[i%L]){ok=false;break}if(ok)return tp.slice(0,L)}return tp}
function mathHint(txt){const m=txt.match(/(\d+) ([+−×]) (\d+)/);if(!m)return'';const a=+m[1],o=m[2],b=+m[3];
  if(o==='+')return b<=10?`Start at ${a} and count on ${b} more.`:`Add the tens first, then the ones: ${a} + ${b-b%10} = ${a+b-b%10}, then add ${b%10}.`;
  if(o==='−')return b<=10?`Start at ${a} and count back ${b}.`:`Take away the tens first: ${a} − ${b-b%10} = ${a-b+b%10}, then take away ${b%10}.`;
  return `${a} × ${b} means ${b} groups of ${a}. Count in ${a}s: ${Array.from({length:Math.min(b,3)},(_,i)=>a*(i+1)).join(', ')}…`}

  const ci=document.getElementById('ci');const I=toGrid(ci,30);const ni=cnt(I);const T=TR.target,A=TR.allow;

function monthStats(ym,maxDay=99){
  const r={days:0,sec:0,rounds:0,stars:0,a:0,c:0,sk:Object.fromEntries(SKILLS.map(s=>[s.id,{a:0,c:0,r:0,stars:0}])),daily:{},medals:{g:0,s:0,b:0}};

    for(const id in d.skills){const s=d.skills[id],t=r.sk[id];if(!t)continue;t.a+=s.a;t.c+=s.c;t.r+=s.r;r.a+=s.a;r.c+=s.c;t.stars+=s.st!=null?s.st:(id==='memory'?0:s.c)}if(d.medals){r.medals.g+=d.medals.g;r.medals.s+=d.medals.s;r.medals.b+=d.medals.b}}

  return`<section class="panel"><div class="mhead"><button class="back" data-act="mprev" aria-label="Previous month">‹</button><div><div class="mn">${MONTHS[m-1]} ${y}</div><div class="note">Progress report for ${esc(S.profile.name)}, age ${S.profile.age} ${S.demo?'<span class="tag">Sample data</span>':''}</div></div><button class="back" data-act="mnext" aria-label="Next month" ${ym>=ymOf()?'disabled style="opacity:.3"':''}>›</button></div>
  ${st.days===0?`<div class="insight">📭<div><b>No play recorded in ${MONTHS[m-1]}</b><br>The report fills in as ${esc(S.profile.name)} plays. Each game adds to this page.</div></div>`:''}
  <div class="kpis"><div class="kpi"><div class="v">${st.days}</div><div class="l">Days played</div>${delta(st.days,pv.days)}</div>
  <div class="kpi"><div class="v">${Math.round(st.sec/60)}</div><div class="l">Minutes</div><div class="d flat">avg ${avg} min/day</div></div>
  <div class="kpi"><div class="v">${st.rounds}</div><div class="l">Games done</div>${delta(st.rounds,pv.rounds)}</div>
  <div class="kpi"><div class="v">${acc}%</div><div class="l">First-try right</div><div class="d ${acc>=pacc?'up':'down'}">${pv.a?`${acc>=pacc?'▲':'▼'} ${Math.abs(acc-pacc)} pts ${VS}`:'—'}</div></div>
  <div class="kpi"><div class="v">⭐ ${st.stars}</div><div class="l">Stars</div>${delta(st.stars,pv.stars)}</div></div></section>
  <div class="grid2"><section class="panel"><h2>Skills this month</h2><p class="note" style="text-align:left;margin:0">Share of questions answered right on the first try. Memory shows matches per flip. Tracing shows the average neatness score.</p>${rows}</section>
  <section class="panel"><h2>What we noticed</h2>${ins.join('')||'<p class="note">Insights appear after a few games.</p>'}</section></div>
  <section class="panel"><h2>Tracing medals</h2><div class="medalrow" style="justify-content:flex-start">${[['🥇','Gold',st.medals.g],['🥈','Silver',st.medals.s],['🥉','Bronze',st.medals.b]].map(([e,l,n])=>`<div class="mcell"><div style="font-size:2rem">${e}</div><div class="mch" style="font-size:1.6rem">${n}</div><div class="mini">${l}</div></div>`).join('')}</div><p class="note" style="text-align:left;margin:0">Gold is 85+ neatness, silver 65+, bronze 40+. Below that, children get a practice ribbon and a specific tip, not a zero.</p></section>
  <section class="panel"><h2>Minutes played each day</h2><div class="chart">${dailyChart(ym,st)}</div></section>`;
}
function settingsHTML(){
  const s=S.settings;
  return`<div class="grid2"><section class="panel"><h2>Child profile</h2><div class="form">
   <div class="field"><label for="pName">Name</label><input id="pName" maxlength="20" value="${esc(S.profile.name)}"></div>
   <div class="field"><span class="flabel">Age</span><div class="seg">${[6,7,8].map(a=>`<button data-act="pAge" data-v="${a}" class="${S.profile.age===a?'on':''}">${a} years</button>`).join('')}</div></div>
   <div class="field"><span class="flabel">Animal buddy</span><div class="buddies">${BUDDIES.map(b=>`<button data-act="pBuddy" data-v="${b}" class="${S.profile.buddy===b?'on':''}">${b}</button>`).join('')}</div></div></div></section>
  <section class="panel"><h2>Time limits</h2><div class="form">
   <div class="field"><label for="pDaily">Daily play time</label><select id="pDaily">${[10,15,20,30,45,60].map(v=>`<option value="${v}" ${s.daily===v?'selected':''}>${v} minutes</option>`).join('')}</select><span class="note" style="text-align:left">Used today: ${Math.round(usedSec()/60)} min${S.extra[dkey()]?` · +${S.extra[dkey()]} min extra given`:''}</span></div>
   <div class="field"><label for="pBreak">Wiggle break every</label><select id="pBreak">${[[0,'Off'],[10,'10 minutes'],[15,'15 minutes'],[20,'20 minutes']].map(([v,l])=>`<option value="${v}" ${s.breakEvery===v?'selected':''}>${l}</option>`).join('')}</select></div>
   <div class="field"><label for="pRound">Questions per game</label><select id="pRound">${[5,8,10].map(v=>`<option value="${v}" ${s.roundLen===v?'selected':''}>${v}</option>`).join('')}</select></div>
   <div class="toggle"><span>Bedtime lock</span><button class="sw ${s.bedOn?'on':''}" data-act="tog" data-v="bedOn" aria-label="Bedtime lock" aria-pressed="${s.bedOn}"></button></div>
   <div class="seg"><div class="field" style="flex:1"><label for="pBs">From</label><input id="pBs" type="time" value="${s.bedStart}"></div><div class="field" style="flex:1"><label for="pBe">Until</label><input id="pBe" type="time" value="${s.bedEnd}"></div></div></div></section>
  <section class="panel"><h2>Games shown</h2>${SKILLS.map(k=>`<div class="toggle"><span>${k.ani} ${k.name}</span><button class="sw ${s.subjects[k.id]?'on':''}" data-act="sub" data-v="${k.id}" aria-label="${k.name}" aria-pressed="${s.subjects[k.id]}"></button></div>`).join('')}
   <div class="toggle"><span>🔔 Sounds</span><button class="sw ${s.sound?'on':''}" data-act="tog" data-v="sound" aria-label="Sounds"></button></div>
   <div class="toggle"><span>🗣️ Read questions aloud</span><button class="sw ${s.voice?'on':''}" data-act="tog" data-v="voice" aria-label="Voice"></button></div></section>
  <section class="panel"><h2>How rewards are designed</h2><ul class="principles">
   <li><b>Praise effort and strategy, not “being smart”.</b> Messages say “careful thinking” or “you went slowly”. Praising intelligence has been shown to make children avoid challenges after a setback (Mueller &amp; Dweck, 1998).</li>
   <li><b>Rewards carry information.</b> Stars and medals follow clear, steady rules tied to how well a task went. Rewards given just for doing a task can reduce a child’s own interest in it (Deci, Koestner &amp; Ryan, 1999). There is no shop, no lucky draws, and no surprise boxes.</li>
   <li><b>Compare with yourself, not others.</b> Children see their personal best and an “improvement star” when they beat it by 10 points. There are no leaderboards.</li>
   <li><b>Specific next-step feedback.</b> Each tracing result says what went well and one thing to try, like “trace every part, even the ends”. Feedback about the task and the process helps more than a score alone (Hattie &amp; Timperley, 2007).</li>
   <li><b>Nobody gets a zero.</b> A low tracing score earns a practice ribbon and a tip. Wrong answers get a hint, and the child keeps going.</li>
   <li><b>Goals they can reach.</b> “8 more points for silver” shows how close the next medal is. Difficulty changes after each game so most questions are just right.</li>
   <li><b>Choice builds motivation.</b> Children choose the game, trace or colour, and the script. Feeling in control, capable and connected (here, to their animal buddy) supports lasting motivation (self-determination theory, Ryan &amp; Deci).</li>
   <li><b>Short and limited.</b> Games are 3 to 5 items, with breaks and daily limits you set, in line with the American Academy of Pediatrics’ advice to set consistent screen-time limits for school-age children.</li></ul></section>
  <section class="panel"><h2>How this app keeps play healthy</h2><ul class="principles"><li>Games end after a few questions. No endless scrolling or autoplay.</li><li>No streaks, leaderboards, ads, or in-app buying.</li><li>Wrong answers get a kind hint. The right answer is shown after two tries.</li><li>Difficulty adjusts quietly after each game so it stays “just right”.</li><li>Daily limit, wiggle breaks and bedtime lock are set by you.</li><li>All progress stays on this device.</li></ul></section>
  <section class="panel"><h2>Security & data</h2><div class="form"><div class="field"><label for="pPin">Change PIN</label><div class="seg"><input id="pPin" type="password" inputmode="numeric" maxlength="4" placeholder="New 4-digit PIN" style="flex:1;border:2px solid var(--line);border-radius:12px;padding:12px"><button data-act="setpin">Save PIN</button></div></div>
   <button class="btn alt sm" data-act="loaddemo">Fill report with sample months</button>
   <div class="danger" id="dz"><span style="flex:1">Clear all progress and stars?</span><button class="btn sm" style="background:var(--bad);box-shadow:0 4px 0 #9A3216" data-act="askreset">Clear progress</button></div></div></section></div>`;
}
function bindSettings(){
  const on=(id,ev,f)=>{const el=document.getElementById(id);if(el)el.addEventListener(ev,f)};
  on('pName','change',e=>{const v=e.target.value.trim();if(v){S.profile.name=v;save();toast('Name saved')}});
  on('pDaily','change',e=>{S.settings.daily=+e.target.value;save();toast('Daily time saved')});
  on('pBreak','change',e=>{S.settings.breakEvery=+e.target.value;save();toast('Break reminder saved')});
  on('pRound','change',e=>{S.settings.roundLen=+e.target.value;save();toast('Saved')});
  on('pBs','change',e=>{S.settings.bedStart=e.target.value;save();toast('Bedtime saved')});
  on('pBe','change',e=>{S.settings.bedEnd=e.target.value;save();toast('Bedtime saved')});
}

// ---------- sample data
function fillDemo(){
  const now=new Date();const accBase={math:.62,think:.58,puzzle:.5,words:.66,gujarati:.48,hindi:.52,memory:.55};
  for(let back=2;back>=0;back--){const ms=new Date(now.getFullYear(),now.getMonth()-back,1);const nd=back===0?now.getDate()-1:new Date(ms.getFullYear(),ms.getMonth()+1,0).getDate();
    for(let d=1;d<=nd;d++){if(Math.random()>.62)continue;const k=`${ms.getFullYear()}-${pad(ms.getMonth()+1)}-${pad(d)}`;const day={sec:ri(7,S.settings.daily+2)*60,rounds:0,stars:0,skills:{}};
      sample(SKILLS.map(s=>s.id),ri(2,3)).forEach(id=>{const r=ri(1,2);if(id==='trace'){const a=r*3,acc=clamp(.55+(2-back)*.08+(Math.random()-.5)*.2,.2,.97),per=acc>=.85?3:acc>=.65?2:1;const st=a*per;day.skills.trace={a,c:a*acc,r,st};day.medals={g:per===3?a:0,s:per===2?a:0,b:per===1?a:0};day.rounds+=r;day.stars+=st;return}const a=id==='memory'?r*ri(7,10):r*5;const acc=clamp(accBase[id]+(2-back)*.08+(Math.random()-.5)*.15,.2,.98);const c=id==='memory'?r*5:Math.round(a*acc);const st=id==='memory'?r*ri(3,5):c;day.skills[id]={a,c,r,st};day.rounds+=r;day.stars+=st});
      S.log[k]=day}}
  S.levels={math:3,think:2,puzzle:2,words:3,gujarati:2,hindi:2,memory:3,trace:2};S.demo=true;save();
}

// ---------- PIN overlay
function askPin(title,cb){pinCb=cb;pinBuf='';drawPin(title,'')}
function drawPin(title,err){
  let ov=document.getElementById('pinov');if(!ov){ov=document.createElement('div');ov.id='pinov';ov.className='overlay';document.body.appendChild(ov)}ov.dataset.title=title;
  ov.innerHTML=`<div class="pinbox" role="dialog" aria-label="${esc(title)}"><h3>${esc(title)}</h3><div class="note">Enter the 4-digit grown-up PIN</div><div class="pindots">${[0,1,2,3].map(i=>`<span class="${i<pinBuf.length?'f':''}"></span>`).join('')}</div><div class="err">${err}</div>
  <div class="keypad">${[1,2,3,4,5,6,7,8,9].map(n=>`<button data-act="pk" data-v="${n}">${n}</button>`).join('')}<button data-act="pcancel" style="font-size:1rem">Cancel</button><button data-act="pk" data-v="0">0</button><button data-act="pdel" aria-label="Delete">⌫</button></div>
  <button class="linkbtn" data-act="forgot" style="font-size:.85rem">Forgot PIN?</button></div>`;
}
function closePin(){const ov=document.getElementById('pinov');if(ov)ov.remove();pinCb=null}
let forgotQ=null;
function showForgot(){const a=ri(12,19),b=ri(6,9);forgotQ=a*b;const ov=document.getElementById('pinov');ov.innerHTML=`<div class="pinbox"><h3>Grown-up check</h3><div class="note">Answer to reset the PIN to 0000.</div><div class="qbig">${a} × ${b} = ?</div><input id="fq" inputmode="numeric" style="border:2px solid var(--line);border-radius:12px;padding:12px;width:100%;font-size:1.2rem;text-align:center"><div class="err" id="fqe"></div><div class="rowbtns"><button class="btn sm alt" data-act="pcancel">Cancel</button><button class="btn sm" data-act="fqok">Reset PIN</button></div></div>`}

// ---------- toast
function toast(t){const o=document.querySelector('.toast');if(o)o.remove();const el=document.createElement('div');el.className='toast';el.textContent=t;document.body.appendChild(el);setTimeout(()=>el.remove(),1800)}

// ---------- events
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,v=b.dataset.v;
  switch(a){
    case 'sAge':setupState.age=+v;renderSetup();break;
    case 'sBuddy':setupState.buddy=v;renderSetup();break;
    case 'demo':S=defaults();S.profile={name:'Aarav',age:7,buddy:'🐘'};S.pin='1234';fillDemo();screen='home';render();toast('Sample child loaded · PIN 1234');break;
    case 'play':if(gate()){screen='home';render();break}if(v==='trace'){screen='tracepick';render();break}startRound(v);break;
    case 'tmode':tMode=v;try{S.tmode=v;save()}catch(_){}renderTracePick();break;
    case 'tstart':startTrace(v);break;
    case 'tcol':tColor=v;document.querySelectorAll('.crayon').forEach(c=>c.classList.toggle('on',c.dataset.v===v));break;
    case 'tclear':{const ci=document.getElementById('ci');ci.getContext('2d').clearRect(0,0,ci.width,ci.height);break}
    case 'tsay':if(TR&&TR.inf)speak(TR.inf.say,TR.inf.lang);break;
    case 'tdone':traceDone();break;
    case 'tretry':{const ci=document.getElementById('ci');ci.getContext('2d').clearRect(0,0,ci.width,ci.height);TR.phase='draw';document.getElementById('tools').hidden=false;document.getElementById('tres').innerHTML='';break}
    case 'tnext':traceNext();break;
    case 'home':closePin();clearInterval(breakTimer);screen='home';R=null;render();break;
    case 'quit':if(screen==='trace')commitChar();screen='home';R=null;render();break;
    case 'stars':screen='stars';render();break;
    case 'say':if(R&&R.q)speak(R.q.say,R.q.lang);break;
    case 'ans':answer(b,v);break;
    case 'flip':flip(+v);break;
    case 'takebreak':startBreak();break;
    case 'parent':askPin('Grown-ups only',()=>{screen='parent';parentTab='report';reportYM=ymOf();render()});break;
    case 'extra':askPin('Add 10 minutes',()=>{S.extra[dkey()]=(S.extra[dkey()]||0)+10;save();screen='home';render();toast('10 minutes added')});break;
    case 'unbed':askPin('Open games for today',()=>{S.bedOk=dkey();save();screen='home';render()});break;
    case 'pk':if(pinBuf.length<4){pinBuf+=v;const t=document.getElementById('pinov').dataset.title;if(pinBuf.length===4){if(pinBuf===S.pin){const cb=pinCb;closePin();cb&&cb()}else{pinBuf='';drawPin(t,'That PIN is not right. Try again.')}}else drawPin(t,'')}break;
    case 'pdel':pinBuf=pinBuf.slice(0,-1);drawPin(document.getElementById('pinov').dataset.title,'');break;
    case 'pcancel':closePin();break;
    case 'forgot':showForgot();break;
    case 'fqok':{const val=+document.getElementById('fq').value;if(val===forgotQ){S.pin='0000';save();closePin();toast('PIN reset to 0000. Change it in Controls.')}else document.getElementById('fqe').textContent='Not quite. Try again.';break}
    case 'ptab':parentTab=v;renderParent();break;
    case 'mprev':reportYM=prevYM(reportYM);renderParent();break;
    case 'mnext':if(reportYM<ymOf()){reportYM=nextYM(reportYM);renderParent()}break;
    case 'pAge':S.profile.age=+v;save();renderParent();toast('Age saved. Games adjust to match.');break;
    case 'pBuddy':S.profile.buddy=v;save();renderParent();break;
    case 'tog':S.settings[v]=!S.settings[v];save();renderParent();break;
    case 'sub':{const n=SKILLS.filter(s=>S.settings.subjects[s.id]).length;if(S.settings.subjects[v]&&n<=1){toast('Keep at least one game on');break}S.settings.subjects[v]=!S.settings.subjects[v];save();renderParent();break}
    case 'setpin':{const p=document.getElementById('pPin').value.trim();if(/^\d{4}$/.test(p)){S.pin=p;save();toast('PIN changed')}else toast('PIN must be 4 numbers');break}
    case 'loaddemo':fillDemo();parentTab='report';renderParent();toast('Sample months added');break;
    case 'askreset':document.getElementById('dz').innerHTML='<span style="flex:1">This deletes all stars and reports on this device.</span><button class="btn sm alt" data-act="ptab" data-v="settings">Keep</button><button class="btn sm" style="background:var(--bad);box-shadow:0 4px 0 #9A3216" data-act="doreset">Yes, clear</button>';break;
    case 'doreset':S.log={};S.extra={};S.demo=false;S.levels=Object.fromEntries(SKILLS.map(s=>[s.id,2]));save();renderParent();toast('Progress cleared');break;
  }
});

// ---------- play timer (counts only while a child screen is visible)
setInterval(()=>{
  if(!S||document.visibilityState!=='visible')return;
  if(!['home','round','memory','result','stars','tracepick','trace','traceend'].includes(screen))return;
  const d=day();d.sec=(d.sec||0)+1;sinceBreak++;
  if(d.sec%10===0)save();
  const el=document.getElementById('tleft');if(el){const m=Math.ceil(remainSec()/60);el.textContent=m;document.getElementById('timer').classList.toggle('low',m<=3)}
  if((screen==='home'||screen==='stars')){if(gate()){save();render()}else if(S.settings.breakEvery>0&&sinceBreak>=S.settings.breakEvery*60){startBreak()}}
},1000);
document.addEventListener('visibilitychange',()=>{if(S)save()});

render();
})();
</script>

if('serviceWorker' in navigator){window.addEventListener('load',()=>{navigator.serviceWorker.register('sw.js').catch(()=>{})})}
try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
